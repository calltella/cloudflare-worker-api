name: Deploy Worker

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: Cache Next.js build
        uses: actions/cache@v4
        with:
          path: |
            .next/cache
          key: ${{ runner.os }}-next-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-next-

      - name: Install dependencies
        run: npm ci --include=dev

      - name: Build
        run: npx opennextjs-cloudflare build  # ✅ OpenNext用ビルド

      - name: Deploy to Cloudflare
        run: npx wrangler deploy

      - name: Set Cloudflare Secrets (bulk)
        run: |
          npx wrangler secret bulk <<EOF
          {
            "R2_ACCESS_KEY_ID":              "${{ secrets.R2_ACCESS_KEY_ID }}",
            "R2_ACCESS_KEY_ID_PRIVATE_S3":   "${{ secrets.R2_ACCESS_KEY_ID_PRIVATE_S3 }}",
            "R2_SECRET_ACCESS_KEY":          "${{ secrets.R2_SECRET_ACCESS_KEY }}",
            "R2_SECRET_ACCESS_KEY_S3":       "${{ secrets.R2_SECRET_ACCESS_KEY_S3 }}",
            "R2_BUCKET":                     "${{ secrets.R2_BUCKET }}",
            "R2_PUBLIC_BUCKET":              "${{ secrets.R2_PUBLIC_BUCKET }}",
            "MAILGUN_API_KEY":               "${{ secrets.MAILGUN_API_KEY }}",
            "MAILGUN_DOMAIN":                "${{ secrets.MAILGUN_DOMAIN }}",
            "MAIL_FROM":                     "${{ secrets.MAIL_FROM }}",
            "CLOUDFLARE_ENV":                "${{ secrets.CLOUDFLARE_ENV }}",
            "JWT_SECRET":                    "${{ secrets.JWT_SECRET }}",
            "KV_SIGNING_SECRET":             "${{ secrets.KV_SIGNING_SECRET }}",
            "API_SERVER_EMAIL":              "${{ secrets.API_SERVER_EMAIL }}",
            "API_SERVER_PASSWORD":           "${{ secrets.API_SERVER_PASSWORD }}",
            "API_URL_BASE":                  "${{ secrets.API_URL_BASE }}",
            "NEXTAUTH_SECRET":               "${{ secrets.NEXTAUTH_SECRET }}",
            "AUTH_URL":                      "${{ secrets.AUTH_URL }}",
            "AUTH_TRUST_HOST":               "${{ secrets.AUTH_TRUST_HOST }}"
          }
          EOF
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
